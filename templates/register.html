{% extends "base.html" %}
{% block title %}学生注册 - 体育用品借还管理系统{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-stage" data-auth-stage>
        <div class="stage-brand">
            <span class="spark-mark">S</span>
            <span>校园器材借还</span>
        </div>
        <span class="auth-court-line line-one"></span>
        <span class="auth-court-line line-two"></span>
        <span class="sport-shape shape-ball"></span>
        <span class="sport-shape shape-racket"></span>
        <span class="sport-shape shape-card"></span>
        <div class="auth-stage-copy">
            <p>学生端入口</p>
            <h2>登记账号后即可申请和跟进器材借用</h2>
        </div>
    </div>
    <div class="form-panel auth-panel">
        <span class="auth-kicker">Student account</span>
        <h1>学生注册</h1>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="username">用户名</label>
                <input class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="real_name">姓名</label>
                <input class="form-control" id="real_name" name="real_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">密码</label>
                <div class="password-field" data-password-field>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                    <button class="password-toggle" type="button" data-password-toggle aria-label="显示密码" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button class="btn btn-accent w-100" type="submit">注册</button>
        </form>
    </div>
</section>
<script src="{{ url_for('static', filename='js/auth-motion.js') }}"></script>
{% endblock %}
